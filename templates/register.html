{% extends 'base.html' %}
{% load static %}

{% block content %}
    <div class="container">
        <h2>Create an Account</h2>
        <form method="post" style="max-width: 400px; margin: 0 auto; background: white; padding: 2rem; border-radius: 8px; box-shadow: 0 4px 10px rgba(0,0,0,0.1);">
            {% csrf_token %}
            {{ form.as_p }}
            <button type="submit" class="btn" style="width: 100%;">Register</button>
        </form>
        <p style="text-align: center; margin-top: 1rem;">Already have an account? <a href="{% url 'login' %}">Login here</a></p>
    </div>
{% endblock %}
