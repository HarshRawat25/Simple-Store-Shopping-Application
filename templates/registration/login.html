{% extends 'base.html' %}

{% block content %}
<div class="auth-container">
    <h2>Login to SimpleStore</h2>
    <form method="post">
        {% csrf_token %}
        {{ form.as_p }}
        <button type="submit" class="btn">Login</button>
    </form>
    <p>Don't have an account? <a href="{% url 'register' %}">Sign up here</a></p>
</div>
{% endblock %}
